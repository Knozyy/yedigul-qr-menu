# Netlify — YALNIZ statik kısım: ana site + statik QR menü (www/).
#
# DİKKAT: Yönetim paneli + API (Node/Express + SQLite) Netlify'da ÇALIŞMAZ;
# Netlify statik host'tur, kalıcı sunucu süreci çalıştıramaz. Panel yerelde
# (run.bat) veya kendi sunucunda/Render'da çalışır. Menü güncelleme akışı:
#   panelde düzenle → npm run export:menu → git push → Netlify otomatik yayınlar.
#
# Bu dosya Netlify panelindeki build ayarını EZER (npm run panel verilmişse bile).

[build]
  publish = "www"
  command = "echo 'statik yayın: www/ hazır, build gerekmez'"

# QR kodları sabit /q yolunu kodlar; sunucuda Express yönlendirir,
# Netlify'da da aynı davranışı bu kural sağlar → basılı QR her yerde çalışır.
[[redirects]]
  from = "/q"
  to = "/menu/"
  status = 302

[[redirects]]
  from = "/qr"
  to = "/menu/"
  status = 302
