# Yedigül — Nginx örnek konfigürasyonu.
# Hedef düzen: 80 → https, www'suz → www (301), asıl içerik yalnız www'da,
# tüm trafik 127.0.0.1:3001'deki Node'a proxy (Node .env'de HOST=127.0.0.1).
#
# NOT (Cloudflare): Alan adı Cloudflare proxy'sinin arkasında. "Always Use
# HTTPS" ve www yönlendirmesi Cloudflare Rules'ta ZATEN tanımlıysa buradaki
# yönlendirme bloklarını sadeleştir — 301 zinciri oluşturma. Sertifika olarak
# Cloudflare Origin Certificate kullanıyorsan certbot yerine onun yollarını yaz.

# Yönetim paneli (/admin/) istek sınırları — IP başına.
# Genel: sayfa + API çağrıları. Giriş: şifre denemeleri (dakikada 5).
limit_req_zone $binary_remote_addr zone=yedigul_admin:10m       rate=10r/s;
limit_req_zone $binary_remote_addr zone=yedigul_admin_login:10m rate=5r/m;

# HTTP → HTTPS
server {
    listen 80;
    server_name yedigulrestorant.com www.yedigulrestorant.com;
    return 301 https://www.yedigulrestorant.com$request_uri;
}

# www'suz → www
server {
    listen 443 ssl http2;
    server_name yedigulrestorant.com;

    ssl_certificate     /etc/letsencrypt/live/yedigulrestorant.com/fullchain.pem;   # << DOĞRULA >>
    ssl_certificate_key /etc/letsencrypt/live/yedigulrestorant.com/privkey.pem;     # << DOĞRULA >>

    return 301 https://www.yedigulrestorant.com$request_uri;
}

# Asıl site
server {
    listen 443 ssl http2;
    server_name www.yedigulrestorant.com;

    ssl_certificate     /etc/letsencrypt/live/yedigulrestorant.com/fullchain.pem;   # << DOĞRULA >>
    ssl_certificate_key /etc/letsencrypt/live/yedigulrestorant.com/privkey.pem;     # << DOĞRULA >>

    # Güvenlik header'ları (production-checklist B3)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Gerçek ziyaretçi IP'si (Cloudflare proxy) ----
    # nginx bağlantıyı Cloudflare'den görür. CF-Connecting-IP başlığına YALNIZ
    # Cloudflare'in kendi adreslerinden gelen isteklerde güvenilir; sunucu
    # IP'sine doğrudan gelen biri başlığı sahteleyip /admin listesini aşamaz.
    # Güncel liste: https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # görsel yüklemeleri için (multer limiti 5MB)
    client_max_body_size 6m;

    # ---- Yönetim paneli: private süreç (yedigul-admin servisi), 127.0.0.1:3002 ----
    # Yalnız /admin/ iletilir; aynı süreçteki /api/auth ve /api/admin dışarıya kapalı kalır.
    # IP listesi panelin .env'indeki ALLOWED_IPS ile AYNI tutulmalı
    # (panel de kendi içinde kontrol eder; ikisi birden düşmedikçe açık kalmaz).
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        allow 0.0.0.0/32;        # << DÜZENLE: restoran dış IP'si (curl -4 https://ifconfig.me) >>
        # allow 0.0.0.0/32;      # << DÜZENLE: ev >>
        deny all;

        limit_req zone=yedigul_admin burst=40 nodelay;
        limit_req_status 429;
        # panel proxy sınırı 8MB
        client_max_body_size 9m;

        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $proxy_add_x_forwarded_for DEĞİL: istemcinin gönderdiği başlık
        # zincire eklenmesin, yalnız nginx'in gördüğü gerçek IP gitsin.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /admin/local-api/session/login {
            limit_req zone=yedigul_admin       burst=40 nodelay;
            limit_req zone=yedigul_admin_login burst=5  nodelay;
            proxy_pass http://127.0.0.1:3002;
        }
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
