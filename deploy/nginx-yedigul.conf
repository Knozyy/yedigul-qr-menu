# Yedigül — Nginx örnek konfigürasyonu.
# Hedef düzen: 80 → https, www'suz → www (301), asıl içerik yalnız www'da,
# tüm trafik 127.0.0.1:3001'deki Node'a proxy (Node .env'de HOST=127.0.0.1).
#
# NOT (Cloudflare): Alan adı Cloudflare proxy'sinin arkasında. "Always Use
# HTTPS" ve www yönlendirmesi Cloudflare Rules'ta ZATEN tanımlıysa buradaki
# yönlendirme bloklarını sadeleştir — 301 zinciri oluşturma. Sertifika olarak
# Cloudflare Origin Certificate kullanıyorsan certbot yerine onun yollarını yaz.

# HTTP → HTTPS
server {
    listen 80;
    server_name yedigulrestorant.com www.yedigulrestorant.com;
    return 301 https://www.yedigulrestorant.com$request_uri;
}

# www'suz → www
server {
    listen 443 ssl http2;
    server_name yedigulrestorant.com;

    ssl_certificate     /etc/letsencrypt/live/yedigulrestorant.com/fullchain.pem;   # << DOĞRULA >>
    ssl_certificate_key /etc/letsencrypt/live/yedigulrestorant.com/privkey.pem;     # << DOĞRULA >>

    return 301 https://www.yedigulrestorant.com$request_uri;
}

# Asıl site
server {
    listen 443 ssl http2;
    server_name www.yedigulrestorant.com;

    ssl_certificate     /etc/letsencrypt/live/yedigulrestorant.com/fullchain.pem;   # << DOĞRULA >>
    ssl_certificate_key /etc/letsencrypt/live/yedigulrestorant.com/privkey.pem;     # << DOĞRULA >>

    # Güvenlik header'ları (production-checklist B3)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # görsel yüklemeleri için (multer limiti 5MB)
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
