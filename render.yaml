# Render Blueprint — Yedigül panel + API + menü (tek servis, tek URL).
# Render bu dosyayı repo'dan okur (Blueprint). Kalıcı disk için ÜCRETLİ instance
# gerekir (free tier'da kalıcı disk yok → data.db her deploy'da sıfırlanır).
services:
  - type: web
    name: yedigul
    runtime: node
    plan: starter            # kalıcı disk paralı instance ister (free'de disk yok)
    region: frankfurt        # TR'ye yakın; istersen değiştir
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/menu
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY      # Render ters vekil arkasında → gerçek IP hız-sınırı
        value: "1"
      - key: DB_PATH          # SQLite kalıcı diskte yaşasın
        value: /data/data.db
      - key: UPLOADS_DIR      # yüklenen ürün görselleri de kalıcı diskte
        value: /data/uploads
      - key: JWT_SECRET       # Render güçlü bir değer üretir
        generateValue: true
      - key: ADMIN_PASSWORD   # panoda elle gir (gizli); repoya yazılmaz
        sync: false
    disk:
      name: yedigul-data
      mountPath: /data
      sizeGB: 1
